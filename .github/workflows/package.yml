name: Package Resource Pack

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - production

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Zip Core
        run: |
          mkdir -p dist
          cd packs/core
          zip -r -X ../../dist/AsteriaMC.zip . -x "*.txt" "*.md"

      - name: SHA-1
        run: |
          cd dist
          sha1sum AsteriaMC.zip | cut -d ' ' -f 1 > AsteriaMC.zip.sha1

      - uses: actions/upload-artifact@v4
        with:
          name: AsteriaMC-resource-pack
          path: |
            dist/AsteriaMC.zip
            dist/AsteriaMC.zip.sha1
